version: '3.8'

services:
  backend:
    build: ./backend
    container_name: dispia-backend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/dispia_crm?schema=public
    networks:
      - dispia-net
    depends_on:
      - db

  frontend:
    build: ./dispia-frontend
    container_name: dispia-frontend
    ports:
      - "3001:3001"
    volumes:
      - ./dispia-frontend:/app
      - /app/node_modules
    environment:
      - PORT=3001
      - NEXT_PUBLIC_API_URL=http://localhost:3000 
    networks:
      - dispia-net
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    container_name: dispia-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dispia_crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dispia-net

networks:
  dispia-net:
    driver: bridge

volumes:
  postgres_data: