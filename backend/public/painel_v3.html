<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DispIA - Enterprise Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --bg-dark: #0f1115; --bg-card: #161b22; --border-color: #262b33;
            --accent-color: #7c3aed; --text-main: #e2e8f0; --sidebar-width: 300px;
        }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .sidebar { position: fixed; top: 0; left: 0; height: 100vh; width: var(--sidebar-width); background-color: var(--bg-card); border-right: 1px solid var(--border-color); padding: 20px; overflow-y: auto; z-index: 99; }
        .main-content { margin-left: var(--sidebar-width); padding: 30px; }
        .card-custom { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .card-header-custom { padding: 15px; border-bottom: 1px solid var(--border-color); font-weight: 600; font-size: 0.9rem; color: #fff; display: flex; justify-content: space-between; align-items: center; }
        .form-control, .form-select { background-color: #0d1117; border: 1px solid #30363d; color: #fff; border-radius: 6px; font-size: 0.85rem; }
        .form-control:focus { background-color: #0d1117; color: #fff; border-color: var(--accent-color); box-shadow: none; }
        .form-label { font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px; }
        .days-wrapper { display: flex; justify-content: space-between; gap: 2px; }
        .day-box input { display: none; }
        .day-box label { cursor: pointer; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 5px; background: #21262d; border: 1px solid #30363d; font-size: 0.7rem; color: #777; transition: 0.2s; }
        .day-box input:checked + label { background: var(--accent-color); color: #fff; border-color: var(--accent-color); }
        .btn-primary-custom { background-color: var(--accent-color); border: none; color: white; padding: 10px; border-radius: 6px; width: 100%; font-weight: 600; transition: 0.2s; }
        .btn-primary-custom:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
        .btn-primary-custom:disabled { background-color: #333; cursor: not-allowed; }
        .terminal-window { background-color: #0d1117; border: 1px solid #30363d; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; height: 300px; overflow-y: auto; padding: 10px; color: #ccc; }
        .log-line { border-bottom: 1px solid #1c2128; padding: 2px 0; display: block; }
        .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .dot-green { background: #3fb950; box-shadow: 0 0 5px #3fb950; }
        .dot-red { background: #f85149; }
        .info-box { background: #21262d; border-radius: 6px; padding: 10px; font-size: 0.8rem; margin-bottom: 15px; }
        .info-label { color: #8b949e; display: block; font-size: 0.7rem; }
        .info-val { color: #fff; font-weight: 600; }
    </style>
</head>
<body>

<nav class="sidebar">
    <div class="mb-4">
        <h5 class="fw-bold"><i class="fab fa-whatsapp text-success"></i> Disp<span style="color:var(--accent-color)">IA</span> <small class="fs-6 text-muted">Pro</small></h5>
    </div>

    <div class="card-custom">
        <div class="card-header-custom">Status da Sessão</div>
        <div class="p-3">
            <div id="connectionStatus" class="text-center mb-3">
                <span class="status-dot dot-red" id="dotStatus"></span>
                <span id="txtStatus" class="fw-bold">DESCONECTADO</span>
            </div>
            <div class="info-box d-none" id="serverDetails">
                <div class="row g-2">
                    <div class="col-12">
                        <span class="info-label">BOT CONECTADO</span>
                        <span class="info-val text-success" id="lblBotPhone">...</span>
                    </div>
                    <div class="col-12 border-top border-secondary pt-2">
                        <span class="info-label">SERVIDOR / LOCAL</span>
                        <span class="info-val" id="lblServerInfo">...</span>
                    </div>
                </div>
            </div>
            <div class="d-grid gap-2">
                <button onclick="conectar()" id="btnConnect" class="btn btn-primary-custom btn-sm">CONECTAR</button>
                <button onclick="desconectar()" id="btnDisconnect" class="btn btn-outline-danger btn-sm d-none">DESCONECTAR</button>
            </div>
            <div id="qrArea" class="mt-3 bg-white p-2 rounded d-none text-center">
                <div id="qrcode" class="d-flex justify-content-center"></div>
                <small class="text-dark d-block mt-1">Escaneie Agora</small>
            </div>
        </div>
    </div>

    <div class="card-custom">
        <div class="card-header-custom">Configurações de Disparo</div>
        <div class="p-3">
            <div class="mb-3">
                <label class="form-label">Delay (Segundos)</label>
                <div class="input-group input-group-sm">
                    <input type="number" id="minDelay" class="form-control text-center" value="15">
                    <span class="input-group-text bg-dark border-secondary">-</span>
                    <input type="number" id="maxDelay" class="form-control text-center" value="45">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Janela de Horário</label>
                <div class="d-flex gap-2">
                    <input type="time" id="timeStart" class="form-control form-control-sm" value="08:00">
                    <input type="time" id="timeEnd" class="form-control form-control-sm" value="18:00">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Dias Permitidos</label>
                <div class="days-wrapper">
                    <div class="day-box"><input type="checkbox" id="d_0"><label for="d_0">D</label></div>
                    <div class="day-box"><input type="checkbox" id="d_1" checked><label for="d_1">S</label></div>
                    <div class="day-box"><input type="checkbox" id="d_2" checked><label for="d_2">T</label></div>
                    <div class="day-box"><input type="checkbox" id="d_3" checked><label for="d_3">Q</label></div>
                    <div class="day-box"><input type="checkbox" id="d_4" checked><label for="d_4">Q</label></div>
                    <div class="day-box"><input type="checkbox" id="d_5" checked><label for="d_5">S</label></div>
                    <div class="day-box"><input type="checkbox" id="d_6"><label for="d_6">S</label></div>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Filtrar Estado (DDD)</label>
                <select id="selectEstado" class="form-select form-select-sm">
                    <option value="TODOS">Todos (Brasil)</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Limite Diário</label>
                <input type="number" id="dailyLimit" class="form-control form-control-sm" value="500">
            </div>
        </div>
    </div>
</nav>

<div class="main-content">
    <div class="container-fluid">
        <div class="row">
            <div class="col-lg-6">
                <div class="card-custom h-100">
                    <div class="card-header-custom">
                        <span class="text-accent"><i class="fas fa-plus-circle"></i> Nova Campanha</span>
                        <small class="text-muted" id="idDisplay">ID: ...</small>
                    </div>
                    <div class="p-4">
                        <div class="mb-3">
                            <label class="form-label">Mensagem</label>
                            <textarea id="msgInput" class="form-control" rows="5" placeholder="Digite o texto do disparo..."></textarea>
                        </div>
                        <div class="row mb-3">
                            <div class="col-6">
                                <label class="form-label"><i class="fas fa-paperclip"></i> Arquivo (Opcional)</label>
                                <input type="file" id="mediaInput" class="form-control form-control-sm">
                            </div>
                            <div class="col-6">
                                <label class="form-label"><i class="fas fa-file-excel"></i> Lista Excel</label>
                                <input type="file" id="excelInput" class="form-control form-control-sm" onchange="lerExcel()">
                            </div>
                        </div>
                        <div id="fileInfo" class="alert alert-success py-2 d-none" style="font-size:0.8rem">
                            <i class="fas fa-check"></i> <strong id="txtContatos">0</strong> números identificados.
                        </div>
                        <button onclick="addJob()" id="btnStart" class="btn btn-primary-custom" disabled>ADICIONAR À FILA</button>
                    </div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="card-custom">
                    <div class="card-header-custom">
                        <span><i class="fas fa-layer-group"></i> Fila de Processamento</span>
                        <span class="badge bg-secondary" id="jobCount">0 Jobs</span>
                    </div>
                    <div class="p-2" id="jobContainer" style="max-height: 250px; overflow-y: auto;">
                        <div class="text-center text-muted mt-4" id="emptyJobs">Nenhuma campanha ativa.</div>
                    </div>
                </div>
                <div class="card-custom mt-3">
                    <div class="card-header-custom py-2">
                        <small><i class="fas fa-terminal"></i> Logs do Servidor (Processamento)</small>
                    </div>
                    <div id="terminal" class="terminal-window">
                        <span class="log-line">> Aguardando processos...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<input type="hidden" id="sessionId">

<script>
    const estadosDDD = {
        "AC": [68], "AL": [82], "AM": [92, 97], "AP": [96], "BA": [71, 73, 74, 75, 77],
        "CE": [85, 88], "DF": [61], "ES": [27, 28], "GO": [62, 64], "MA": [98, 99],
        "MG": [31, 32, 33, 34, 35, 37, 38], "MS": [67], "MT": [65, 66], "PA": [91, 93, 94],
        "PB": [83], "PE": [81, 87], "PI": [86, 89], "PR": [41, 42, 43, 44, 45, 46],
        "RJ": [21, 22, 24], "RN": [84], "RO": [69], "RR": [95], "RS": [51, 53, 54, 55],
        "SC": [47, 48, 49], "SE": [79], "SP": [11, 12, 13, 14, 15, 16, 17, 18, 19], "TO": [63]
    };
    
    const selectEstado = document.getElementById('selectEstado');
    Object.keys(estadosDDD).sort().forEach(sigla => {
        const opt = document.createElement('option');
        opt.value = sigla; opt.innerText = sigla;
        selectEstado.appendChild(opt);
    });

    let myId = localStorage.getItem('dispia_session_id');
    if (!myId || myId === 'undefined') {
        myId = 'sessao_' + Math.floor(Math.random() * 100000);
        localStorage.setItem('dispia_session_id', myId);
    }
    document.getElementById('sessionId').value = myId;
    document.getElementById('idDisplay').innerText = `ID: ${myId}`;

    let contactsBuffer = [];
    let jobs = [];
    let isProcessing = false;

    window.onload = () => {
        const savedJobs = localStorage.getItem('dispia_jobs');
        if (savedJobs) {
            try {
                const parsed = JSON.parse(savedJobs);
                jobs = parsed.map(j => ({ ...j, status: j.status === 'Rodando' ? 'Pausado' : j.status, media: null }));
                if(jobs.length > 0) {
                    document.getElementById('emptyJobs').classList.add('d-none');
                    jobs.forEach(renderJobCard);
                    processQueue();
                }
            } catch(e) {}
        }
        monitorStatus();
        monitorLogs();
    };

    function saveJobs() {
        const toSave = jobs.map(j => ({...j, media: null}));
        localStorage.setItem('dispia_jobs', JSON.stringify(toSave));
    }

    function lerExcel() {
        const f = document.getElementById('excelInput').files[0];
        if(!f) return;
        const r = new FileReader();
        r.onload = (e) => {
            const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
            const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1});
            contactsBuffer = [];
            json.forEach(row => {
                row.forEach(c => {
                    if(c) {
                        let n = c.toString().replace(/\D/g,'');
                        if(n.length>=10) contactsBuffer.push(n.length<=11?'55'+n:n);
                    }
                });
            });
            contactsBuffer = [...new Set(contactsBuffer)];
            document.getElementById('txtContatos').innerText = contactsBuffer.length;
            document.getElementById('fileInfo').classList.remove('d-none');
            if(contactsBuffer.length>0) document.getElementById('btnStart').disabled=false;
        };
        r.readAsArrayBuffer(f);
    }

    function addJob() {
        const msg = document.getElementById('msgInput').value;
        const mediaInput = document.getElementById('mediaInput');
        
        if(!msg && !mediaInput.files[0]) return alert('Mensagem ou arquivo necessários.');

        const diasSelected = [
            document.getElementById('d_0').checked,
            document.getElementById('d_1').checked,
            document.getElementById('d_2').checked,
            document.getElementById('d_3').checked,
            document.getElementById('d_4').checked,
            document.getElementById('d_5').checked,
            document.getElementById('d_6').checked
        ];

        const newJob = {
            id: Date.now(),
            contacts: [...contactsBuffer],
            msg: msg,
            media: mediaInput.files[0], 
            hasMedia: !!mediaInput.files[0],
            config: {
                min: parseInt(document.getElementById('minDelay').value),
                max: parseInt(document.getElementById('maxDelay').value),
                start: document.getElementById('timeStart').value,
                end: document.getElementById('timeEnd').value,
                limit: parseInt(document.getElementById('dailyLimit').value),
                dias: diasSelected,
                estado: document.getElementById('selectEstado').value
            },
            progress: 0,
            status: 'Fila',
            canceled: false
        };

        jobs.push(newJob);
        saveJobs();
        document.getElementById('emptyJobs').classList.add('d-none');
        renderJobCard(newJob);
        document.getElementById('msgInput').value = '';
        mediaInput.value = '';
        document.getElementById('fileInfo').classList.add('d-none');
        document.getElementById('btnStart').disabled = true;
        processQueue();
    }

    function renderJobCard(job) {
        const existing = document.getElementById(`job-${job.id}`);
        if(existing) existing.remove();
        const container = document.getElementById('jobContainer');
        const div = document.createElement('div');
        div.className = 'card-custom p-3 mb-2 border-secondary';
        div.id = `job-${job.id}`;
        let statusColor = 'bg-secondary';
        if(job.status === 'Rodando') statusColor = 'bg-primary';
        if(job.status === 'Concluído') statusColor = 'bg-success';
        if(job.status === 'Cancelado') statusColor = 'bg-danger';
        if(job.status === 'Pausado') statusColor = 'bg-warning text-dark';
        const perc = Math.floor((job.progress / job.contacts.length) * 100);
        const btnCancel = (job.status !== 'Concluído' && job.status !== 'Cancelado') ? `<button onclick="cancelJob(${job.id})" class="btn btn-outline-danger btn-sm py-0" style="font-size:0.7rem">Cancelar</button>` : '';
        const warnMedia = (job.hasMedia && !job.media && job.status !== 'Concluído') ? `<div class="text-warning small mt-1"><i class="fas fa-exclamation-triangle"></i> Mídia perdida no refresh. Envio será apenas texto.</div>` : '';

        div.innerHTML = `
            <div class="d-flex justify-content-between align-items-center mb-2">
                <strong><i class="fas fa-hashtag"></i> ${job.id}</strong>
                <div><span class="badge ${statusColor}" id="badge-${job.id}">${job.status}</span> ${btnCancel}</div>
            </div>
            <div class="progress" style="height: 6px; background-color: #333;"><div class="progress-bar bg-info" style="width: ${perc}%"></div></div>
            <div class="d-flex justify-content-between mt-1 text-muted" style="font-size:0.75rem"><span>${job.progress}/${job.contacts.length}</span><span>${perc}%</span></div>
            ${warnMedia}
        `;
        container.prepend(div);
        document.getElementById('jobCount').innerText = `${jobs.length} Jobs`;
    }

    function cancelJob(id) {
        const j = jobs.find(x => x.id === id);
        if(j) { j.canceled = true; j.status = 'Cancelado'; renderJobCard(j); saveJobs(); }
    }

    async function processQueue() {
        if(isProcessing) return;
        isProcessing = true;
        const job = jobs.find(j => (j.status === 'Fila' || j.status === 'Rodando' || j.status === 'Pausado') && !j.canceled);
        if(!job) { isProcessing = false; return; }

        job.status = 'Rodando'; renderJobCard(job); saveJobs();

        for (let i = job.progress; i < job.contacts.length; i++) {
            if(job.canceled) { job.status = 'Cancelado'; renderJobCard(job); saveJobs(); isProcessing = false; processQueue(); return; }
            await checkAntiBan(job.config, job.id);
            const phone = job.contacts[i];
            
            let pularEnvio = false;
            if (job.config.estado && job.config.estado !== 'TODOS') {
                const dddsPermitidos = estadosDDD[job.config.estado] || [];
                const dddContato = parseInt(phone.substring(2, 4));
                if (!dddsPermitidos.includes(dddContato)) pularEnvio = true;
            }

            if (!pularEnvio) {
                try {
                    if (job.media) {
                        const fd = new FormData();
                        fd.append('sessionId', myId); fd.append('number', phone); fd.append('caption', job.msg); fd.append('type', 'document'); fd.append('file', job.media);
                        await fetch('/message/upload', {method:'POST', body:fd});
                    } else {
                        await fetch('/message/text', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({sessionId:myId, number:phone, message:job.msg})});
                    }
                } catch(e) {}
            }
            job.progress = i + 1; renderJobCard(job); saveJobs();
            if(i < job.contacts.length - 1) {
                const wait = Math.floor(Math.random() * (job.config.max - job.config.min + 1) + job.config.min) * 1000;
                await new Promise(r => setTimeout(r, wait));
            }
        }
        job.status = 'Concluído'; renderJobCard(job); saveJobs();
        isProcessing = false; processQueue();
    }

    async function checkAntiBan(conf, jobId) {
        while(true) {
            const currentJob = jobs.find(x => x.id === jobId);
            if(!currentJob || currentJob.canceled) return;
            const now = new Date();
            const diaSemana = now.getDay();
            const minNow = now.getHours()*60 + now.getMinutes();
            const [h1, m1] = conf.start.split(':').map(Number);
            const [h2, m2] = conf.end.split(':').map(Number);
            
            let motivo = '';
            if (conf.dias && !conf.dias[diaSemana]) motivo = 'Dia Não Permitido';
            else if(minNow < (h1*60+m1) || minNow > (h2*60+m2)) motivo = 'Horário Não Permitido';

            if (motivo) {
                const el = document.getElementById(`badge-${jobId}`);
                if(el) { el.className='badge bg-warning text-dark'; el.innerText=`Pausa: ${motivo}`; }
                await new Promise(r => setTimeout(r, 60000));
                continue;
            }
            const el = document.getElementById(`badge-${jobId}`);
            if(el) { el.className='badge bg-primary'; el.innerText='Rodando'; }
            return;
        }
    }

    async function conectar() {
        document.getElementById('btnConnect').disabled = true;
        await fetch('/session/start', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({sessionId: myId}) });
    }

    async function desconectar() {
        await fetch('/session/logout', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({sessionId: myId}) });
        location.reload();
    }

    function monitorStatus() {
        setInterval(async () => {
            try {
                const r = await fetch(`/session/status?sessionId=${myId}`);
                const d = await r.json();
                const dot = document.getElementById('dotStatus');
                const txt = document.getElementById('txtStatus');
                
                if(d.status === 'connected') {
                    dot.className = 'status-dot dot-green'; txt.innerText = 'CONECTADO'; txt.className = 'fw-bold text-success';
                    document.getElementById('qrArea').classList.add('d-none'); document.getElementById('btnConnect').classList.add('d-none');
                    document.getElementById('btnDisconnect').classList.remove('d-none'); document.getElementById('serverDetails').classList.remove('d-none');
                    if(d.phoneNumber) document.getElementById('lblBotPhone').innerText = d.phoneNumber;
                    if(d.serverInfo) document.getElementById('lblServerInfo').innerText = `${d.serverInfo.ip} (${d.serverInfo.local})`;
                } else if (d.qrCode) {
                    dot.className = 'status-dot dot-red'; txt.innerText = 'AGUARDANDO LEITURA'; txt.className = 'fw-bold text-white';
                    document.getElementById('qrArea').classList.remove('d-none');
                    const q = document.getElementById('qrcode');
                    if(q.innerHTML==='') new QRCode(q, {text:d.qrCode, width:150, height:150});
                }
            } catch(e) {}
        }, 3000);
    }

    function monitorLogs() {
        setInterval(async () => {
            try {
                const r = await fetch('/admin/logs');
                const d = await r.json();
                if(d.logs) {
                    const term = document.getElementById('terminal');
                    term.innerHTML = d.logs.map(l => {
                        // CONVERSÃO MÁGICA DE HORA
                        const horaLocal = new Date(l.timestamp).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                        return `<span class="log-line"><span style="color:#666">[${horaLocal}]</span> ${l.message}</span>`;
                    }).join('');
                }
            } catch(e) {}
        }, 2000);
    }
</script>
</body>
</html>
